<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <link id="favicon" rel="shortcut icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Nunito|Roboto:400,700|Product+Sans" rel="stylesheet" type="text/css">
  <title>Telegram Web</title>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script>
  (function() {
    var root = typeof globalThis !== 'undefined' ? globalThis : window;
    var current = root.process || {};
    if (!current.nextTick) {
      current = {
        env: current.env || { NODE_ENV: 'production', BROWSER: 'true' },
        version: current.version || 'v16.0.0', versions: current.versions || {},
        browser: true, nextTick: function(cb) { Promise.resolve().then(cb); },
        cwd: function() { return '/'; }, exit: function() {}, on: function() {},
        off: function() {}, emit: function() {}, argv: [], platform: 'browser'
      };
    }
    root.process = current;
  })();
  var process = window.process;
</script>
<script type="module" src="/src/index.js"></script>
</body>
</html>
