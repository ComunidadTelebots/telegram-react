name: Archivar ramas históricas de Telegram React
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/archive-legacy-branches.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Conservar cada punta como etiqueta y retirar sus ramas en una sola transacción
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q --bare archive.git
          cd archive.git
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          refspecs=()
          leases=()
          while read -r sha name; do
            ref="refs/heads/$name"
            archive="refs/tags/archive/2026-11-22/$name"
            git fetch -q --no-tags --depth=1 origin "$ref"
            test "$(git rev-parse FETCH_HEAD)" = "$sha"
            refspecs+=("$sha:$archive" ":$ref")
            leases+=("--force-with-lease=$ref:$sha" "--force-with-lease=$archive:")
          done <<'REFS'
          cf32cdc52cbe9c4264c254c9cbe8f89adf5406b4 chore/visual-consistency-pass
          0b1ebe57acd4fb0fb78df0e6f18b7c7189840100 dependabot/npm_and_yarn/handlebars-4.6.0
          20dabadeee75a50952db3b5ca15981fe8159664c feat/bot-webapps
          03154f8340ecebf918665f50b5cc0f73014a6f97 feat/channel-boosts-and-extras
          6a1ca11498e1c07ab4fe815f4df4a6bfd7383060 feat/forum-topics
          522b932524c3035bf6d9cef859d764d258ee474f feat/inline-mode
          81030d0c5209db5d32ffbbe874e481c41e24ab85 feat/instant-view-amp-improvements
          5dffb75ae641ac4b80480edc81cc621f488df859 feat/lottie-stickers
          dcf59041222fe15ed3d3691cba4c7d7832a9260c feat/media-albums
          3197d8d41a8989bc3342b1e9e88a41bad19dc975 feat/reactions-extended
          ccb6cfd4e21c83b9bea2c987aa0935a21e12588d feature/lector-amp-editor
          bbfb79fec0ecf9eab53d994a433e260b10d148ff feature/paridad-android-comunidad-citas
          4a3d57e4a3c19c5ff5ea80e7682af56106db0114 gh-pages
          8e6890be60d8e0ad4892d85482a01fbd1f208812 security/enlaces-de-mensajes
          d509ebf60e3dc0752f2e8af48789fdf1ef25d8a1 web-a/formato-envio-edicion
          REFS
          git push --atomic "${leases[@]}" origin "${refspecs[@]}"
